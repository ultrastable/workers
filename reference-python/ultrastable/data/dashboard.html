<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultrastable — control room</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#262d36;--tx:#e6edf3;--mut:#8b96a3;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;letter-spacing:.3px}h1 small{color:var(--mut);font-weight:400;margin-left:8px}
main{padding:18px 22px;display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:0 0 10px}
.kpis{grid-column:span 12;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:12px}
.w4{grid-column:span 4}.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}.w8{grid-column:span 8}.w12{grid-column:span 12}
@media(max-width:1000px){.w4,.w5,.w6,.w7,.w8{grid-column:span 12}}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);text-align:left;font-weight:500}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line)}
.s-done{color:var(--ok)}.s-blocked{color:var(--bad)}.s-claimed{color:var(--acc)}.s-ready{color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
button{background:var(--acc);color:#04111f;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;margin:0;color:var(--mut);font-size:12px}
.scroll{max-height:340px;overflow:auto}.ev{font-size:12px;color:var(--mut)}.ev b{color:var(--tx);font-weight:500}
.banner{grid-column:span 12;padding:8px 14px;border-radius:8px;background:#1f2a1f;border:1px solid #2d4a2d;color:#9be29b;font-size:12px}
</style></head><body>
<header><h1>ULTRASTABLE <small id="org"></small></h1><span class="ev" id="stamp"></span></header>
<main>
<div class="banner" id="banner" hidden></div>
<section class="kpis" id="kpis"></section>
<section class="card w5"><h2>Virtual managers</h2><table id="mgr"></table></section>
<section class="card w7"><h2>Last tick report (four lines)</h2><pre id="report"></pre></section>
<section class="card w12"><h2>Owner gate cards — the only things that interrupt a person</h2><div id="gates"></div></section>
<section class="card w8"><h2>Work items</h2><div class="scroll"><table id="items"></table></div></section>
<section class="card w4"><h2>Projects</h2><div id="proj"></div></section>
<section class="card w6"><h2>Earned trust (per surface / action)</h2><table id="trust"></table></section>
<section class="card w6"><h2>Rule amendments (self-amend)</h2><div id="amend" class="scroll"></div></section>
<section class="card w12"><h2>Audit trail</h2><div class="scroll" id="events"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const token=new URLSearchParams(location.search).get('token')||'';
async function resolveGate(id){await fetch('/api/gates/'+id+'/resolve',{method:'POST',headers:{authorization:'Bearer '+token},body:'{}'});load()}
async function load(){
 const s=await (await fetch('/api/state')).json(),k=s.kpis;
 $('org').textContent=s.org;$('stamp').textContent='updated '+new Date().toLocaleTimeString();
 const pct=v=>v==null?'—':Math.round(v*100)+'%';
 $('kpis').innerHTML=[['Ticks',k.ticks],['Items done',k.items_done],['Active',k.items_active],['Prediction hit rate',pct(k.prediction_hit_rate)],
  ['Plus share',pct(k.plus_share)],['Owner gates open',k.open_gates],['Silent drops',k.silent_drops],['Rules version','v'+k.rules_version]]
  .map(([a,b])=>`<div class="card kpi"><b>${esc(b)}</b><span>${a}</span></div>`).join('');
 $('mgr').innerHTML='<tr><th>Role</th><th>Responsibility</th></tr>'+s.managers.map(m=>`<tr><td><b>${m.role}</b></td><td>${esc(m.does)}</td></tr>`).join('');
 $('report').textContent=(s.last_tick&&s.last_tick.report)||'No tick yet.';
 $('gates').innerHTML=s.gates.length?'<table><tr><th>Card</th><th>What</th><th>Why gated</th><th>Default in effect</th><th>State</th><th></th></tr>'+s.gates.map(g=>`<tr><td>${esc(g.id)}</td><td>${esc(g.what)}</td><td>${esc(g.why_gated)}</td><td>${esc(g.default_in_effect)}</td><td>${g.status}</td><td>${g.status==='open'?`<button onclick="resolveGate('${esc(g.id)}')">I did this</button>`:''}</td></tr>`).join('')+'</table>':'<span class="ev">None open. The fleet is not waiting on a person.</span>';
 $('items').innerHTML='<tr><th>ID</th><th>Status</th><th>Kind</th><th>Project</th><th>Pri</th><th>Title</th><th>Blocker</th></tr>'+s.items.map(i=>`<tr><td>${esc(i.id)}</td><td class="s-${i.status}">${i.status}</td><td>${i.kind}</td><td>${esc(i.project)}</td><td>${i.priority}</td><td>${esc(i.title)}</td><td>${esc(i.blocker)}</td></tr>`).join('');
 $('proj').innerHTML=s.projects.map(p=>{const t=p.done+p.active||1;return `<div style="margin-bottom:10px"><b>${esc(p.title)}</b> <span class="ev">weight ${p.weight}</span><div class="ev">${esc(p.outcome)}</div><div class="bar"><i style="width:${Math.round(100*p.done/t)}%"></i></div><span class="ev">${p.done} done · ${p.active} active</span></div>`}).join('');
 $('trust').innerHTML='<tr><th>Surface / action</th><th>Rung</th><th>Reliability</th><th>n</th></tr>'+s.trust.map(t=>`<tr><td>${t.surface}/${t.action_class}</td><td><span class="pill">${t.rung}</span></td><td>${t.reliability.toFixed(2)}</td><td>${t.outcomes}</td></tr>`).join('');
 $('amend').innerHTML=s.amendments.length?s.amendments.map(a=>`<div class="ev" style="margin-bottom:8px"><b>${a.id}</b> [${a.status}] ${esc(a.proposal)}<br>evidence: ${esc(a.pattern)}</div>`).join(''):'<span class="ev">No recurring failure pattern yet.</span>';
 $('events').innerHTML=s.events.map(e=>`<div class="ev">${e.at} · <b>${esc(e.actor)}</b> ${e.kind} ${esc(e.item_id)} ${esc(e.detail)}</div>`).join('');
 const m=await (await fetch('/healthz')).json();
}
load();setInterval(load,5000);
</script></body></html>
