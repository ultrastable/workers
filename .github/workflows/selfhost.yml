name: self-hosting
# Ultrastable is run by Ultrastable: every pull request must carry the record the contract asks for (agents/CONTRACT.md),
# whatever tool or person made it, and the generated agent files must match the contract.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: selfhost-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Agent files match the contract
        run: python tools/sync_agent_files.py --repo workers --target . --check
      - name: Pull request carries the record
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          FILES=$(gh pr diff "$PR_NUMBER" --name-only | paste -sd, -)
          python tools/selfhost_check.py --body-file /tmp/pr-body.md --author "$PR_AUTHOR" --files "$FILES" --labels "$PR_LABELS"
