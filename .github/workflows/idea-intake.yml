# budget: ~1 minute per labelled issue, only on the `idea` label event
# trigger: issues labeled (an owner idea arrives at human speed, never polled)
# free-alternative: the tenant tick can call ideaToItem in core/promote directly
name: idea-intake
on:
  issues:
    types: [labeled]
permissions:
  issues: write
concurrency:
  group: idea-intake-${{ github.event.issue.number }}
jobs:
  intake:
    if: github.event.label.name == 'idea' && vars.HALT != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Turn the idea into an agent-ready item
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module -e '
            import { ideaToItem } from "./core/promote/index.js";
            const i = ideaToItem({ number: process.env.ISSUE, title: process.env.TITLE, body: process.env.BODY });
            process.stdout.write(JSON.stringify(i));' > item.json
          jq -r .body item.json > body.md
          gh issue create --title "$(jq -r .title item.json)" --body-file body.md --label agent-ready --label from-owner-idea
          gh issue comment "$ISSUE" --body "Taken in as an agent-ready item; agents build, merge, deploy and verify it without further input."
