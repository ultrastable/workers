name: self-start
# allow-schedule: the start must retry itself until the owner has set the secrets and there is no Cloudflare tick before it exists; about 1 minute per run, 4 runs a day is about 120 of the 2000 free minutes a month. Remove the schedule once started (org/started.json exists): the job exits at once.
# Starts Ultrastable on Ultrastable and keeps trying until it has started (tools/self_start.py).
# Dry run until the owner has set the repository secrets; after that the next run applies, deploys, puts the Worker's
# secrets (values on stdin, never printed) and records org/started.json, which closes the gate issue by its probe.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: self-start
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Start
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SELF_VCS_TOKEN: ${{ secrets.SELF_VCS_TOKEN }}
          SELF_CONSOLE_TOKEN: ${{ secrets.SELF_CONSOLE_TOKEN }}
        run: python tools/self_start.py --repo "${{ github.repository }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record the boot in the repository
        run: |
          git config user.name "ultrastable-self-start"
          git config user.email "self-start@users.noreply.github.com"
          git add org/started.json org/start-attempt.json org/boot-log.json org/boot-report.md 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "self-start: record the boot (names only, no secret values)" && git push; }
