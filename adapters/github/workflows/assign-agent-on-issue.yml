# TEMPLATE: copy to .github/workflows/ in an organization repository. Manual trigger only (no schedule, US-SPEC-24 cost rules):
# scheduled work runs from the Worker tick, not from Actions minutes.
name: assign-agent-on-issue
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to hand to the coding agent
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign the issue to the configured agent login
        run: gh api "repos/${{ github.repository }}/issues/${{ inputs.issue }}/assignees" -f "assignees[]=${{ vars.AGENT_LOGIN }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
