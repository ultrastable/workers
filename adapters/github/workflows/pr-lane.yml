# TEMPLATE: copy to .github/workflows/ in an organization repository. Manual trigger only (no schedule, US-SPEC-24 cost rules):
# scheduled work runs from the Worker tick, not from Actions minutes.
name: pr-lane
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch the pull request record
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr }}" --jq .head.sha)
          CHECKS=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq 'if ([.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length) == 0 then "success" else "failure" end')
          gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr }}" --jq "{body: .body, author: .user.login, labels: [.labels[].name], checks: \"$CHECKS\"}" > pr.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Review gate (independent reviewer, real evidence)
        run: python tools/review_gate.py --pr pr.json
