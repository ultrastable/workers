# TEMPLATE: copy to .github/workflows/ in an organization repository. Manual trigger only (no schedule, US-SPEC-24 cost rules):
# scheduled work runs from the Worker tick, not from Actions minutes.
name: remediation-consumer
on:
  workflow_dispatch:
    inputs:
      failures:
        description: Path of a JSONL failure file in the repository
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/remediation_consumer.py --in "${{ inputs.failures }}" --state ops/remediation-state.json
