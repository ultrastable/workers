[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastable"
version = "0.2.0"
description = "A self-governing control loop around the coding agents a team already uses."
requires-python = ">=3.11"
dependencies = []
license = { text = "LicenseRef-Ultrastable-USL-1.0" }

[project.scripts]
ultrastable = "ultrastable.cli:main"

[tool.setuptools.packages.find]
include = ["ultrastable*"]

[tool.setuptools.package-data]
ultrastable = ["data/*"]
